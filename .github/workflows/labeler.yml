# Labels each pull request by the paths it changes; .github/labeler.yml says
# which paths carry which label.
name: labeler

# pull_request_target, not pull_request: a pull request from a fork gets a
# read-only token under pull_request and could not be labeled. The target
# event runs this file as main has it with a token that can write, so the job
# must never check out or run anything from the pull request. The labeler
# reads only the list of changed paths through the API, and with no checkout
# it fetches .github/labeler.yml at main's commit, so a pull request cannot
# relabel itself by editing that file.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
